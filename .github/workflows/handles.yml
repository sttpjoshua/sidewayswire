# Run by hand (Actions > handles > Run workflow) to refresh driver socials and FD portraits.
name: handles
on:
  workflow_dispatch:
    inputs:
      alleen_portretten: { description: "Alleen FD-portretten (met uitgeknipte versie voor kop-posts)", type: boolean, default: false }
      zoek_tags: { description: "Alleen ontbrekende tags zoeken (open namen uit TAGS) en via Instagram controleren", type: boolean, default: false }
permissions: { contents: write }
jobs:
  handles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest data, also when the run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - if: ${{ inputs.zoek_tags }}
        env: { META_TOKEN: "${{ secrets.META_TOKEN }}" }
        run: python -m lc.verify_handles && python -m lc.status && python -m lc.gitsave "tags gezocht" data/sources.csv data/handle_suggestions.json docs/status.json
      - if: ${{ !inputs.alleen_portretten && !inputs.zoek_tags }}
        run: python -m lc.find_handles
      - if: ${{ !inputs.zoek_tags }}
        run: python -m lc.portraits
      - if: ${{ !inputs.zoek_tags }}
        run: python -m lc.gitsave "driver socials en portretten" data/sources.csv data/portraits.json docs/media/portraits
