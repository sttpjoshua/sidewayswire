# Run by hand (Actions > handles > Run workflow) to refresh driver socials.
name: handles
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  handles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest data, also when the run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests && python -m lc.find_handles
      - run: python -m lc.gitsave "driver socials" data/sources.csv
