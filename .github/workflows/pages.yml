# Publishes the dashboard (docs/) to GitHub Pages, only when something in docs/ changed.
# The Mac and the editors commit data many times an hour; the old "deploy from branch" built the site on
# every commit and the builds kept cancelling each other, so the site stopped updating.
name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: docs }
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: d
        uses: actions/deploy-pages@v4
