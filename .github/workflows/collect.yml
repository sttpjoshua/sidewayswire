# Collects news every 15 minutes and refreshes the dashboard.
# GitHub's own timer can run a few minutes late; cron-job.org can take over later.
name: collect
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest data, also when the run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests feedparser
      - name: Collect
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -m lc.collect
      - name: Dashboard
        run: python -m lc.status
      - name: Save
        run: |
          git config user.name "sidewayswire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs/status.json
          git diff --cached --quiet && exit 0
          git commit -m "collect $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
