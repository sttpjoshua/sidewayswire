# Finds new podcast episodes and makes transcripts with Whisper. Every two hours.
name: podcasts
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      per_run:
        description: "How many episodes to transcribe this run"
        default: "3"
      episode:
        description: "Transcribe this episode id first (from the dashboard)"
        default: ""
concurrency: { group: podcasts, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  podcasts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests feedparser faster-whisper jinja2 playwright yt-dlp && python -m playwright install --with-deps chromium && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en
      - name: Find and transcribe episodes
        env:
          PODCASTS_PER_RUN: ${{ inputs.per_run || '3' }}
          EPISODE: ${{ inputs.episode }}
        run: python -m lc.podcasts
      - name: Make clips of picked moments
        run: python -m lc.podclips
      - name: Save
        run: |
          git config user.name "sidewayswire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/podcasts queue docs/media
          git diff --cached --quiet && exit 0
          git commit -m "podcasts $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
