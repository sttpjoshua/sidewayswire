# Finds new podcast episodes and makes transcripts with Whisper. Every two hours.
name: podcasts
run-name: podcasts ${{ inputs.episode }}
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      per_run:
        description: "How many episodes to transcribe this run"
        default: "3"
      episode:
        description: "Transcribe this episode id first (from the dashboard)"
        default: ""
concurrency: { group: podcasts, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  podcasts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest data, also when the run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests feedparser faster-whisper jinja2 && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en
      - name: Find and transcribe episodes
        env:
          PODCASTS_PER_RUN: ${{ inputs.per_run || '3' }}
          EPISODE: ${{ inputs.episode }}
          GH_TOKEN: ${{ github.token }}
        run: python -m lc.podcasts
      - name: Save
        run: python -m lc.status && python -m lc.gitsave "podcasts $(date -u +%FT%TZ)" data/podcasts docs/status.json
      - name: Start the clips run (separate, so it can run next to the next transcription)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/clips.yml/dispatches -f ref=main || true
      - name: Tell the dashboard the run is over
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -c "from lc import progress; progress.done()"
