# Makes the podcast clips (and later the livestream clips). Runs next to the transcription,
# so clips never wait for a long episode. Started by the podcasts run, the Mac helper and the dashboard.
name: clips
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"      # safety net
concurrency: { group: clips, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      PROGRESS_FILE: docs/clips-now.json
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests jinja2 playwright pillow feedparser numpy && python -m playwright install --with-deps chromium && sudo apt-get install -y -qq ffmpeg
      - name: Free up room in video-sources (GitHub allows 1000 files; at the limit the Mac's uploads fail)
        run: python -m lc.prune || true
      - name: Make clips
        run: python -m lc.results && python -m lc.podclips
      - name: Short versions for TikTok and Shorts
        run: python -m lc.shorts 200 || true
      - name: Light previews for the dashboard (phone)
        run: python -m lc.previews 300 || true
      - name: Save
        run: (python -m lc.agents qc || true) && python -m lc.planner && python -m lc.mediastore sync && python -m lc.status && python -m lc.gitsave "clips $(date -u +%FT%TZ)" data/podcasts queue docs/media docs/status.json docs/agents
      - name: Build and plan the new clips (Plaatsen)
        run: gh workflow run run.yml --ref main || true
      - name: Tell the dashboard the clips run is over
        if: always()
        run: python -c "from lc import progress; progress.done()"
