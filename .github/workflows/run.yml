# The whole loop. Started every 15 minutes by cron-job.org (same set-up as Bibleverse).
name: run
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"    # backup (26 nov): if cron-job.org misses a beat, still at least once an hour
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
env:
  LC_DRY_RUN: ${{ vars.LC_DRY_RUN || '1' }}      # set repo variable LC_DRY_RUN=0 to go live
  PAGES_URL: ${{ vars.PAGES_URL }}
  GH_TOKEN: ${{ github.token }}
  MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
  META_TOKEN: ${{ secrets.META_TOKEN }}
  TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
  TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_TOKEN: ${{ secrets.IG_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT: ${{ secrets.TG_CHAT }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest data, also when the run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: 1 collect
        run: python -m lc.collect && (python -m lc.agents scout || true)
      - name: kop-posts (vragen op voorraad)
        run: python -m lc.hooks
      - name: 2 build posts and handle Telegram answers
        run: python -m lc.build && (python -m lc.agents qc || true)
      - name: plan per platform (score, tijden, captions)
        run: python -m lc.planner
      - name: media naar de releases, wat bijna online gaat naar de site
        run: python -m lc.mediastore sync
      - name: 3 publish what is due
        run: python -m lc.publish
      - name: community (reacties liken, eerste reactie, goedgekeurde antwoorden)
        run: python -m lc.engage || true
      - name: 4 dashboard
        run: python -m lc.stats || true; python -m lc.status
      - name: save
        run: python -m lc.gitsave "run $(date -u +%FT%TZ)" data queue docs
