# TikTok connection (lc/tiktok.py). Started from the dashboard (KOPPEL TIKTOK) and by the sign-in page.
name: tiktok
on:
  workflow_dispatch:
    inputs:
      action: { description: "login | exchange | info | test", required: true, default: info }
      post: { description: "for test: post id (its short version is posted privately)", required: false, default: "" }
permissions: { contents: write }
concurrency: { group: tiktok, cancel-in-progress: false }
jobs:
  tiktok:
    runs-on: ubuntu-latest
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests cryptography jinja2
      - env: { ACT: "${{ inputs.action }}", POST: "${{ inputs.post }}" }
        run: python -m lc.tiktok "$ACT" ${POST:+"$POST"}
      - run: python -m lc.status && python -m lc.gitsave "tiktok" data/tiktok data/channels.json docs/status.json
