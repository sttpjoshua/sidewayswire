<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sideways Wire dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#151517;--card:#232326;--accent:#C6FF00;--pink:#FF2E88;--mute:#B8B8BC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;padding:20px;max-width:1100px;margin:auto}
h1,h2,.n{font-family:"Bebas Neue",sans-serif;letter-spacing:1px;margin:0}
h1{display:inline-block;background:#fff;color:#111;padding:8px 14px 4px;font-size:34px;transform:rotate(-2deg)}
h2{font-size:28px;margin:34px 0 12px}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:24px}
.c{background:var(--card);padding:14px;border:3px solid #111}.c .n{font-size:46px;color:var(--accent)}.c small{color:var(--mute);font-weight:800;letter-spacing:1px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.p{background:var(--card);display:flex;flex-direction:column}.p img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#111}
.p div{padding:10px 12px;font-size:13px;line-height:1.4}.tag{display:inline-block;font-weight:800;font-size:11px;letter-spacing:1px;padding:3px 7px;margin-right:6px;background:#fff;color:#111}
.tag.ready{background:var(--accent)}.tag.check{background:var(--pink)}.tag.posted{background:#111;color:#fff;border:1px solid #fff}.tag.skipped{background:#555;color:#fff}
.cap{color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}
li{margin:6px 0;color:var(--mute)}li b{color:#fff}.buzz{color:var(--accent);font-weight:800}
#upd{color:var(--mute);font-size:13px;margin-top:14px}
</style></head><body>
<h1>SIDEWAYS WIRE</h1><div id="upd">laden...</div>
<div class="counts" id="counts"></div>
<h2>POSTS</h2><div class="grid" id="posts"></div>
<h2>BINNENGEKOMEN NIEUWS</h2><ul id="inbox"></ul>
<script>
const NL={draft:"concept",ready:"ingepland",check:"wacht op jou",posted:"geplaatst",skipped:"overgeslagen"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=t=>t?new Date(t).toLocaleString("nl-NL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
fetch("status.json?"+Date.now()).then(r=>r.json()).then(s=>{
  upd.textContent="Bijgewerkt: "+when(s.updated);
  counts.innerHTML=Object.keys(NL).map(k=>`<div class="c"><div class="n">${s.counts[k]||0}</div><small>${NL[k].toUpperCase()}</small></div>`).join("");
  posts.innerHTML=s.posts.map(p=>`<div class="p">${p.media[0]?`<img loading="lazy" src="${esc(p.media[0])}">`:""}<div><span class="tag ${esc(p.status)}">${esc(NL[p.status]||p.status).toUpperCase()}</span><b>${esc(p.kind)}</b><br>${when(p.posted_at||p.post_at)}${(p.problems||[]).length?`<br><span style="color:var(--pink)">${esc(p.problems[0])}</span>`:""}<div class="cap" style="padding:0">${esc(p.caption)}</div></div></div>`).join("")||"<p>Nog geen posts.</p>";
  inbox.innerHTML=s.inbox.map(i=>`<li><span class="buzz">${i.buzz}x</span> <b>${esc(i.series)}</b> ${esc(i.title)}</li>`).join("")||"<li>Niets nieuws.</li>";
}).catch(()=>upd.textContent="Nog geen gegevens.");
</script></body></html>
