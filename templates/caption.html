{% extends "base.html" %}
{# One caption chunk, transparent, 1080 wide. The spoken words in a tape bar,
   text centered in the bar. Data: text, accent_word (optional) #}
{% block body %}
<div class="abs" style="left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center">
  <div class="bb tape" data-fit data-size="74" data-min="48" style="background:#111;color:#fff;border:5px solid #fff;font-size:74px;transform:rotate(-1deg);text-align:center;max-width:960px;white-space:normal;line-height:1.05">{{ text }}</div>
</div>
{% endblock %}
